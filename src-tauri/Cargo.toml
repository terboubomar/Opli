[package]
name = "intent-layer"
version = "0.1.0"
description = "Local-first desktop recipe engine"
authors = ["Intent Layer contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "intent_layer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

